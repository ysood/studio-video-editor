[package]
name = "studio-app"
description = "Studio desktop shell: exposes studio-core to the UI over Tauri IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "studio_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
studio-core = { path = "../crates/studio-core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true

[lints]
workspace = true
