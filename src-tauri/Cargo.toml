[package]
name = "studio-app"
description = "Studio desktop shell: exposes studio-core to the UI over Tauri IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "studio_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
studio-core = { path = "../crates/studio-core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true

[dev-dependencies]
studio-core = { path = "../crates/studio-core", features = ["testing"] }

[lints.rust]
# AppKit and AVFoundation interop cannot be expressed in safe Rust (ADR-0003). Denied
# here rather than forbidden so the one module that talks to Objective-C can opt in;
# studio-core keeps the workspace-wide forbid.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-av-foundation = { version = "0.3", features = [
  "AVPlayer", "AVPlayerItem", "AVPlayerLayer", "AVAsset", "AVAssetTrack",
  "AVComposition", "AVCompositionTrack", "AVMediaFormat",
  "AVVideoComposition", "AVVideoCompositing",
  "objc2-core-media", "objc2-core-foundation", "objc2-quartz-core", "block2", "dispatch2",
] }
